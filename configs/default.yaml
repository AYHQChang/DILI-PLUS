project_root: ..

database:
  path: D:/MedicalAI_Work/duck/medical.duckdb
  read_only: true

paths:
  data_cache: data_cache
  manifests: manifests
  vocab: vocab
  checkpoints: checkpoints
  reports: reports
  figures: figures
  saved_models: saved_models
  tensors: tensors
  drug_mapping: mapping_completed_drugs_checkpoint.csv
  drug_mapping_template: mapping_template_drugs.csv

training:
  epochs: 50
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.00001
  hidden_size: 128
  num_heads: 4
  dropout: 0.3
  diagnosis_modality_dropout_prob: 0.15
  # Unweighted focal modulation: (1 - p_t)^gamma * cross_entropy.
  # There is intentionally no scalar alpha masquerading as class weighting.
  focal_gamma: 2.0
  selection_metric: AUPRC
  early_stopping_patience: 7
  scheduler_patience: 3

prediction:
  # Formal Code-10 analyses must rebuild the outcome from source laboratory
  # rows. The frozen legacy labels are permitted only for an explicitly named
  # pipeline pilot and are never a formal result source.
  label_source: deterministic_rebuild
  baseline_threshold_u_l: 120.0
  # Primary prospective task: all dynamic events must occur strictly before
  # t_prediction = index_time - gap_hours.
  gap_hours: 24
  pseudo_index_seed: 20260816
  audit_horizons_hours: [0, 12, 24, 48, 72]
  # The formal model artifact is already truncated 24 h before index_time.
  # Horizons below 24 h cannot be reconstructed from that artifact.
  early_warning_horizons_hours: [24, 48, 72]

reproducibility:
  # Explicit component seeds prevent a plotting change from silently changing
  # data splits or metric bootstrap samples.
  global_seed: 20260816
  split_seed: 20260816
  bootstrap_seed: 20260816
  figure_seed: 20260816
  deterministic_torch: true
  dataloader_num_workers: 0
  pseudo_index_sensitivity_seeds: [20260816, 20260817, 20260818, 20260819, 20260820]

evaluation_protocol:
  outer_folds: 5
  selection_fraction: 0.15
  calibration_fraction: 0.15
  split_search_attempts: 128
  bootstrap_replicates: 1000
  p_auc_fpr_limits: [0.05, 0.10, 0.20]
  risk_thresholds: [0.005, 0.01, 0.02, 0.05]
  alert_budgets: [0.005, 0.01, 0.02, 0.05]
  dca_min_threshold: 0.005
  dca_max_threshold: 0.05
  dca_step: 0.0025
